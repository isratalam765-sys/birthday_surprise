<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Something Is Hidden... 🔐</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         BACKGROUND MUSIC
    ====================================== -->

    <audio
        id="bgMusic"
        loop
        preload="auto"
    >

        <source
            src="leberch-happy-birthday-581704.mp3"
            type="audio/mpeg"
        >

        Your browser does not support the audio element.

    </audio>



    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="stars"></div>



    <!-- =====================================
         FLOATING HEARTS
    ====================================== -->

    <div class="hearts">

        <span>❤️</span>
        <span>💕</span>
        <span>💖</span>
        <span>💗</span>

    </div>



    <!-- =====================================
         SECRET PAGE
    ====================================== -->

    <main class="secret-page">


        <!-- Top label -->

        <div class="secret-badge">

            🔐 SECRET LEVEL 01

        </div>



        <!-- Lock -->

        <div class="lock-container">

            <div class="lock-glow"></div>

            <div class="lock-icon">

                🔒

            </div>

        </div>



        <!-- Text -->

        <div class="secret-content">


            <p class="small-text">

                Hmm... 👀

            </p>



            <h1>

                There's Something

                <span>
                    Hidden Here...
                </span>

            </h1>



            <p class="secret-description">

                If you really know me,
                you should be able to unlock this.

            </p>



            <!-- =================================
                 QUESTION CARD
            ================================== -->

            <div class="question-card">


                <p class="question-number">

                    QUESTION 01

                </p>



                <h2 id="question">

                    What is the most special date?

                </h2>



                <!-- Answer -->

                <div class="answer-box">


                    <input
                        type="text"
                        id="answerInput"
                        placeholder="Enter your answer..."
                        autocomplete="off"
                    >


                    <button
                        id="unlockBtn"
                        type="button"
                    >

                        Unlock 🔓

                    </button>


                </div>



                <!-- Error message -->

                <p id="message"></p>


            </div>



            <!-- Hint -->

            <button
                id="hintBtn"
                class="hint-btn"
                type="button"
            >

                💡 Need a hint?

            </button>



            <p
                id="hintText"
                class="hint-text"
            ></p>


        </div>



        <!-- Bottom -->

        <div class="bottom-message">

            Some memories are worth unlocking ❤️

        </div>


    </main>



    <!-- =====================================
         SUCCESS SCREEN
    ====================================== -->

    <div
        id="successScreen"
        class="success-screen"
    >


        <div class="success-content">


            <div class="success-heart">

                💖

            </div>



            <h2>

                You remembered... ❤️

            </h2>



            <p>

                I knew you would.

            </p>



            <button
                id="continueBtn"
                type="button"
            >

                Continue the journey ✨

            </button>


        </div>


    </div>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                /* =====================================
                   MUSIC
                ===================================== */

                const music =
                    document.getElementById(
                        "bgMusic"
                    );


                const MUSIC_TIME_KEY =
                    "birthdayMusicTime";


                /*
                Restore the exact position
                saved by the previous page.
                */

                const savedTime =
                    parseFloat(
                        localStorage.getItem(
                            MUSIC_TIME_KEY
                        )
                    );


                if (
                    music &&
                    Number.isFinite(savedTime) &&
                    savedTime >= 0
                ) {

                    music.addEventListener(
                        "loadedmetadata",
                        () => {

                            try {

                                music.currentTime =
                                    savedTime;

                            }
                            catch (error) {

                                console.log(
                                    "Could not restore music position."
                                );

                            }

                        },
                        {
                            once: true
                        }
                    );

                }


                /*
                Try to continue the music.
                */

                if (music) {

                    const playMusic =
                        () => {

                            music.play()
                                .catch(
                                    () => {

                                        /*
                                        Browser may block
                                        autoplay after navigation.
                                        The next user interaction
                                        will start it.
                                        */

                                    }
                                );

                        };


                    playMusic();


                    /*
                    If autoplay is blocked,
                    continue on first interaction.
                    */

                    const resumeMusic =
                        () => {

                            if (
                                music.paused
                            ) {

                                music.play()
                                    .catch(
                                        () => {}
                                    );

                            }

                        };


                    document.addEventListener(
                        "click",
                        resumeMusic,
                        {
                            once: true
                        }
                    );


                    document.addEventListener(
                        "touchstart",
                        resumeMusic,
                        {
                            once: true
                        }
                    );


                    /*
                    Save music position continuously.
                    */

                    music.addEventListener(
                        "timeupdate",
                        () => {

                            localStorage.setItem(
                                MUSIC_TIME_KEY,
                                music.currentTime
                            );

                        }
                    );


                    window.addEventListener(
                        "beforeunload",
                        () => {

                            localStorage.setItem(
                                MUSIC_TIME_KEY,
                                music.currentTime
                            );

                        }
                    );

                }



                /* =====================================
                   CORRECT ANSWER
                ===================================== */

                const correctAnswer =
                    "19-10-2023";



                /* =====================================
                   ELEMENTS
                ===================================== */

                const input =
                    document.getElementById(
                        "answerInput"
                    );


                const unlockBtn =
                    document.getElementById(
                        "unlockBtn"
                    );


                const message =
                    document.getElementById(
                        "message"
                    );


                const hintBtn =
                    document.getElementById(
                        "hintBtn"
                    );


                const hintText =
                    document.getElementById(
                        "hintText"
                    );


                const successScreen =
                    document.getElementById(
                        "successScreen"
                    );


                const continueBtn =
                    document.getElementById(
                        "continueBtn"
                    );



                /* =====================================
                   UNLOCK
                ===================================== */

                function checkAnswer() {


                    const userAnswer =
                        input.value
                            .trim()
                            .toLowerCase();


                    const correct =
                        correctAnswer
                            .toLowerCase();



                    if (
                        userAnswer ===
                        correct
                    ) {


                        message.textContent =
                            "Correct! ❤️";


                        message.style.color =
                            "#ff9edc";


                        successScreen.classList.add(
                            "active"
                        );


                    }
                    else {


                        message.textContent =
                            "Not quite... Try again 👀";


                        message.style.color =
                            "#ff8fa3";


                        input.classList.add(
                            "wrong"
                        );


                        setTimeout(
                            () => {

                                input.classList.remove(
                                    "wrong"
                                );

                            },
                            500
                        );

                    }

                }



                /* =====================================
                   UNLOCK BUTTON
                ===================================== */

                unlockBtn.addEventListener(
                    "click",
                    checkAnswer
                );



                /* =====================================
                   ENTER KEY
                ===================================== */

                input.addEventListener(
                    "keydown",
                    (event) => {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            checkAnswer();

                        }

                    }
                );



                /* =====================================
                   HINT
                ===================================== */

                hintBtn.addEventListener(
                    "click",
                    () => {


                        hintText.textContent =
                            "It's a date that means something special to us... 💕";


                        hintBtn.textContent =
                            "💡 Hint revealed";


                    }
                );



                /* =====================================
                   CONTINUE
                ===================================== */

                continueBtn.addEventListener(
                    "click",
                    () => {


                        /*
                        Save exact music position
                        before changing page.
                        */

                        if (music) {

                            localStorage.setItem(
                                MUSIC_TIME_KEY,
                                music.currentTime
                            );

                        }


                        window.location.href =
                            "gift.html";

                    }
                );


            }
        );

    </script>


</body>

</html>
