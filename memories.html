<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Little Universe ❤️</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         BACKGROUND MUSIC
    ====================================== -->

    <audio
        id="bgMusic"
        loop
        preload="auto"
    >

        <source
            src="leberch-happy-birthday-581704.mp3"
            type="audio/mpeg"
        >

        Your browser does not support the audio element.

    </audio>



    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="stars"></div>



    <!-- =====================================
         FLOATING HEARTS
    ====================================== -->

    <div class="hearts">

        <span>❤️</span>
        <span>💕</span>
        <span>💖</span>
        <span>💗</span>
        <span>💞</span>

    </div>



    <!-- =====================================
         MEMORY PAGE
    ====================================== -->

    <main class="memory-page">


        <!-- =================================
             HEADER
        ================================== -->

        <header class="memory-header">


            <p class="small-text">

                Every little moment...

            </p>



            <h1>

                Our Little

                <span>
                    Universe ❤️
                </span>

            </h1>



            <p class="memory-intro">

                Some moments may seem small...

                <br>

                But somehow,
                they became memories
                worth keeping forever.

            </p>


        </header>



        <!-- =================================
             MEMORY UNIVERSE
        ================================== -->

        <div class="memory-universe">


            <!-- Center -->

            <div class="universe-center">


                <div class="center-glow"></div>


                <div class="center-heart">

                    ❤️

                </div>


                <p>

                    OUR<br>
                    LITTLE<br>
                    UNIVERSE

                </p>


            </div>



            <!-- =================================
                 MEMORY CARD 01
            ================================== -->

            <button
                class="memory-card card-one"
                type="button"
                data-number="01"
                data-title="How It All Started"
                data-icon="🌸"
                data-image="memory1.jpeg"
                data-description="Every beautiful story has a beginning. Ours started with a simple moment that somehow became something unforgettable."
            >

                <span class="memory-number">
                    MEMORY 01
                </span>

                <span class="memory-icon">
                    🌸
                </span>

                <strong>
                    How It All Started
                </strong>

                <small>
                    Where it all started
                </small>

            </button>



            <!-- =================================
                 MEMORY CARD 02
            ================================== -->

            <button
                class="memory-card card-two"
                type="button"
                data-number="02"
                data-title="Getting Closer"
                data-icon="😊"
                data-image="memory2.jpeg"
                data-description="Those little smiles, random laughs and silly moments somehow became some of the sweetest parts of the story."
            >

                <span class="memory-number">
                    MEMORY 02
                </span>

                <span class="memory-icon">
                    😊
                </span>

                <strong>
                    Getting Closer
                </strong>

                <small>
                    The moments that made us smile
                </small>

            </button>



            <!-- =================================
                 MEMORY CARD 03
            ================================== -->

            <button
                class="memory-card card-three"
                type="button"
                data-number="03"
                data-title="Our Silly Moments"
                data-icon="💬"
                data-image="memory3.jpeg"
                data-description="Sometimes it was the longest conversations. Sometimes it was just a few words. But somehow, every conversation mattered."
            >

                <span class="memory-number">
                    MEMORY 03
                </span>

                <span class="memory-icon">
                    💬
                </span>

                <strong>
                    Our Silly Moments
                </strong>

                <small>
                    Words that stayed
                </small>

            </button>



            <!-- =================================
                 MEMORY CARD 04
            ================================== -->

            <button
                class="memory-card card-four"
                type="button"
                data-number="04"
                data-title="Late Night Talks"
                data-icon="✨"
                data-image="memory4.jpeg"
                data-description="The tiny details are often the ones we remember most. A message, a smile, a joke, a moment... all of them became special."
            >

                <span class="memory-number">
                    MEMORY 04
                </span>

                <span class="memory-icon">
                    ✨
                </span>

                <strong>
                    Late Night Talks
                </strong>

                <small>
                    Small moments, big feelings
                </small>

            </button>



            <!-- =================================
                 MEMORY CARD 05
            ================================== -->

            <button
                class="memory-card card-five"
                type="button"
                data-number="05"
                data-title="Moments I Keep"
                data-icon="📸"
                data-image="memory5.jpeg"
                data-description="Some memories fade with time. The beautiful ones somehow stay with us, quietly reminding us of how special those moments were."
            >

                <span class="memory-number">
                    MEMORY 05
                </span>

                <span class="memory-icon">
                    📸
                </span>

                <strong>
                    Moments I Keep
                </strong>

                <small>
                    Moments worth keeping
                </small>

            </button>



            <!-- =================================
                 MEMORY CARD 06
            ================================== -->

            <button
                class="memory-card card-six"
                type="button"
                data-number="06"
                data-title="Still Becoming Us"
                data-icon="💫"
                data-image="memory6.jpeg"
                data-description="Maybe the best memories aren't behind us at all. Maybe there are still many beautiful moments waiting for us."
            >

                <span class="memory-number">
                    MEMORY 06
                </span>

                <span class="memory-icon">
                    💫
                </span>

                <strong>
                    Still Becoming Us
                </strong>

                <small>
                    The story continues...
                </small>

            </button>


        </div>



        <!-- =================================
             CONTINUE
        ================================== -->

        <button
            id="memoryContinue"
            class="memory-continue"
            type="button"
        >

            Continue Our Story

            <span>
                →
            </span>

        </button>


    </main>



    <!-- =====================================
         MEMORY MODAL
    ====================================== -->

    <div
        id="memoryModal"
        class="memory-modal"
    >


        <div class="memory-modal-content">


            <!-- Close -->

            <button
                id="closeMemory"
                class="close-memory"
                type="button"
                aria-label="Close"
            >

                ×

            </button>



            <!-- Image -->

            <div
                id="modalImage"
                class="modal-image"
            >

                <img
                    id="modalPhoto"
                    src=""
                    alt="Memory Photo"
                >

                <span id="modalIcon">
                    ❤️
                </span>

            </div>



            <!-- Number -->

            <p
                id="modalNumber"
                class="modal-number"
            >

                MEMORY 01

            </p>



            <!-- Title -->

            <h2 id="modalTitle">

                The Beginning

            </h2>



            <!-- Description -->

            <p id="modalDescription">

                Every beautiful story has a beginning.

            </p>


        </div>


    </div>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                /* =====================================
                   MUSIC CONTINUITY
                ===================================== */

                const music =
                    document.getElementById(
                        "bgMusic"
                    );


                const MUSIC_TIME_KEY =
                    "birthdayMusicTime";


                const savedTime =
                    parseFloat(
                        localStorage.getItem(
                            MUSIC_TIME_KEY
                        )
                    );


                if (
                    music &&
                    Number.isFinite(savedTime) &&
                    savedTime >= 0
                ) {

                    music.addEventListener(
                        "loadedmetadata",
                        () => {

                            try {

                                music.currentTime =
                                    savedTime;

                            }
                            catch (error) {

                                console.log(
                                    "Could not restore music position."
                                );

                            }

                        },
                        {
                            once: true
                        }
                    );

                }


                if (music) {


                    music.play()
                        .catch(
                            () => {}
                        );


                    const resumeMusic =
                        () => {

                            if (
                                music.paused
                            ) {

                                music.play()
                                    .catch(
                                        () => {}
                                    );

                            }

                        };


                    document.addEventListener(
                        "click",
                        resumeMusic,
                        {
                            once: true
                        }
                    );


                    document.addEventListener(
                        "touchstart",
                        resumeMusic,
                        {
                            once: true
                        }
                    );


                    music.addEventListener(
                        "timeupdate",
                        () => {

                            localStorage.setItem(
                                MUSIC_TIME_KEY,
                                music.currentTime
                            );

                        }
                    );


                    window.addEventListener(
                        "beforeunload",
                        () => {

                            localStorage.setItem(
                                MUSIC_TIME_KEY,
                                music.currentTime
                            );

                        }
                    );

                }



                /* =====================================
                   MEMORY MODAL
                ===================================== */

                const memoryCards =
                    document.querySelectorAll(
                        ".memory-card"
                    );


                const memoryModal =
                    document.getElementById(
                        "memoryModal"
                    );


                const closeMemory =
                    document.getElementById(
                        "closeMemory"
                    );


                const modalImage =
                    document.getElementById(
                        "modalImage"
                    );


                const modalPhoto =
                    document.getElementById(
                        "modalPhoto"
                    );


                const modalIcon =
                    document.getElementById(
                        "modalIcon"
                    );


                const modalNumber =
                    document.getElementById(
                        "modalNumber"
                    );


                const modalTitle =
                    document.getElementById(
                        "modalTitle"
                    );


                const modalDescription =
                    document.getElementById(
                        "modalDescription"
                    );



                /* =====================================
                   OPEN MEMORY
                ===================================== */

                memoryCards.forEach(
                    (card) => {


                        card.addEventListener(
                            "click",
                            () => {


                                const number =
                                    card.dataset.number;


                                const title =
                                    card.dataset.title;


                                const icon =
                                    card.dataset.icon;


                                const image =
                                    card.dataset.image;


                                const description =
                                    card.dataset.description;



                                modalNumber.textContent =
                                    "MEMORY " +
                                    number;


                                modalTitle.textContent =
                                    title;


                                modalDescription.textContent =
                                    description;


                                modalIcon.textContent =
                                    icon;


                                if (image) {

                                    modalPhoto.src =
                                        image;

                                    modalPhoto.style.display =
                                        "block";

                                    modalIcon.style.display =
                                        "none";

                                }
                                else {

                                    modalPhoto.src =
                                        "";

                                    modalPhoto.style.display =
                                        "none";

                                    modalIcon.style.display =
                                        "block";

                                }


                                modalImage.classList.remove(
                                    "has-image"
                                );


                                memoryModal.classList.add(
                                    "active"
                                );


                            }
                        );


                    }
                );



                /* =====================================
                   CLOSE MEMORY
                ===================================== */

                function closeModal() {

                    memoryModal.classList.remove(
                        "active"
                    );

                }


                closeMemory.addEventListener(
                    "click",
                    closeModal
                );



                /*
                Close when clicking outside
                the modal content.
                */

                memoryModal.addEventListener(
                    "click",
                    (event) => {

                        if (
                            event.target ===
                            memoryModal
                        ) {

                            closeModal();

                        }

                    }
                );



                /*
                ESC key closes modal.
                */

                document.addEventListener(
                    "keydown",
                    (event) => {

                        if (
                            event.key ===
                            "Escape"
                        ) {

                            closeModal();

                        }

                    }
                );



                /* =====================================
                   CONTINUE
                ===================================== */

                const memoryContinue =
                    document.getElementById(
                        "memoryContinue"
                    );


                memoryContinue.addEventListener(
                    "click",
                    () => {


                        /*
                        Save exact music position
                        before leaving.
                        */

                        if (music) {

                            localStorage.setItem(
                                MUSIC_TIME_KEY,
                                music.currentTime
                            );

                        }


                        window.location.href =
                            "quiz.html";

                    }
                );


            }
        );

    </script>


</body>

</html>
